_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .repo.yaml
# A `#%` line is a Jinja statement and a TOML or YAML comment: `standard.toml.jinja` stays
# valid TOML, so the Renovate mise manager reads its pins (ADR 0031).
_envops:
  line_statement_prefix: "#%"
# Files written once; template updates never overwrite them.
_skip_if_exists:
  # Entries are gitignore patterns: the slash keeps the README files of `.maintain/` updatable.
  - /README.md
  - docs/architecture.md
  - docs/tasks.md
  - docs/access.md
  - .gitignore
  - CLAUDE.md
  - docs/operations.md
  # Project-owned and protected (ADR 0017): exclusions of project data from the spelling check.
  - .config/typos.toml
  # TypeScript profile: project rules and the measured duplication threshold.
  - .config/eslint.project.mjs
  - .config/dependency-cruiser.cjs
  - .config/knip.json
  - .config/jscpd.json
  # The project's old ESLint violations; the template only starts the file.
  - .baselines/eslint-suppressions.json

project_name:
  type: str
  help: Project name

level:
  type: str
  help: Standard level
  choices:
    base: base
    full: full
  default: base
  validator: >-
    {% if level == 'full' %}Level "full" is not supported yet; use "base".{% endif %}

team:
  type: str
  help: Team size
  choices:
    solo: solo
  default: solo

language:
  type: str
  help: Language of comments and documents
  choices:
    en: en
    ru: ru
    auto: auto
  default: en

stack:
  type: yaml
  multiselect: true
  help: Technology stack
  choices:
    terraform: terraform
    typescript: typescript
  default: []

architecture:
  type: yaml
  help: Architecture description (mapping)
  default: {}

system:
  type: yaml
  help: System description (mapping or null)
  default: null

contract:
  type: yaml
  help: Contract description (mapping or null)
  default: null

required_ci_branches:
  type: yaml
  help: Branches that require CI
  default: [main]
  validator: >-
    {% if required_ci_branches is string or not required_ci_branches %}required_ci_branches needs a non-empty list of branch names.{% endif %}

md_exceptions:
  type: yaml
  help: Markdown files exempt from checks
  default: []

root_files:
  type: yaml
  help: Project files and folders allowed in the repository root besides the standard ones
  default: []

report_schedule:
  type: str
  help: Report schedule
  choices:
    "off": "off"
    monthly: monthly
    weekly: weekly
    twice-weekly: twice-weekly
  default: weekly

maintain_adapter:
  type: str
  help: Maintenance agent adapter (none, manual or the name of an own adapter)
  default: none
  validator: >-
    {% if not maintain_adapter | regex_search('^[a-z0-9][a-z0-9-]*$') or maintain_adapter == 'jobs' %}maintain_adapter needs a name of lowercase letters, digits and hyphens, other than "jobs".{% endif %}

maintain_schedule:
  type: str
  help: Maintenance schedule
  choices:
    "off": "off"
    monthly: monthly
    weekly: weekly
  default: "off"
  validator: >-
    {% if maintain_schedule != 'off' %}maintain_schedule "{{ maintain_schedule }}" is not supported yet; use "off".{% endif %}

deployed:
  type: bool
  help: Is the system deployed (adds docs/operations.md)
  default: false

overrides:
  type: yaml
  help: "Per-file overrides: list of {file, reason}"
  default: []
