_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .repo.yaml
# Files written once; template updates never overwrite them.
_skip_if_exists:
  - README.md
  - docs/architecture.md
  - docs/tasks.md
  - docs/access.md
  - .gitignore
  - CLAUDE.md
  - docs/operations.md
  # Project-owned and protected (ADR 0017): exclusions of project data from the spelling check.
  - .config/typos.toml
  # TypeScript profile: project rules and the measured duplication threshold.
  - .config/eslint.project.mjs
  - .config/dependency-cruiser.cjs
  - .config/knip.json
  - .config/jscpd.json
  # The project's old ESLint violations; the template only starts the file.
  - .baselines/eslint-suppressions.json

project_name:
  type: str
  help: Project name

level:
  type: str
  help: Standard level
  choices:
    base: base
    full: full
  default: base
  validator: >-
    {% if level == 'full' %}Level "full" is not supported yet; use "base".{% endif %}

team:
  type: str
  help: Team size
  choices:
    solo: solo
  default: solo

stack:
  type: yaml
  multiselect: true
  help: Technology stack
  choices:
    terraform: terraform
    typescript: typescript
  default: []

architecture:
  type: yaml
  help: Architecture description (mapping)
  default: {}

system:
  type: yaml
  help: System description (mapping or null)
  default: null

contract:
  type: yaml
  help: Contract description (mapping or null)
  default: null

required_ci_branches:
  type: yaml
  help: Branches that require CI
  default: [main]
  validator: >-
    {% if required_ci_branches is string or not required_ci_branches %}required_ci_branches needs a non-empty list of branch names.{% endif %}

md_exceptions:
  type: yaml
  help: Markdown files exempt from checks
  default: []

root_files:
  type: yaml
  help: Project files and folders allowed in the repository root besides the standard ones
  default: []

report_schedule:
  type: str
  help: Report schedule
  choices:
    "off": "off"
    monthly: monthly
    weekly: weekly
    twice-weekly: twice-weekly
  default: weekly

deployed:
  type: bool
  help: Is the system deployed (adds docs/operations.md)
  default: false

overrides:
  type: yaml
  help: "Per-file overrides: list of {file, reason}"
  default: []
